apiVersion: v1
kind: Secret
metadata:
  name: hello-world-secret
  labels:
    app: hello-world
type: Opaque
# stringData : valeur en clair, Kubernetes l'encode lui-même en base64 dans .data
# ATTENTION : dépôt public, ce message est lisible par tous sur GitHub (démo uniquement)
stringData:
  message: "Bonjour depuis le projet hello"
